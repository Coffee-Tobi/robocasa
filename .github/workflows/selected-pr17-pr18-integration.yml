name: Reviewed PR17 PR18 Offline Integration
on:
  pull_request:
    paths:
      - 'robobarista/real_latte_dataset.py'
      - 'robobarista/realman_fk_bridge.py'
      - 'robobarista/external_pose_replay.py'
      - 'robobarista/original_camera_tags.py'
      - 'robobarista/latte_dmp.py'
      - 'robobarista/vision_quality.py'
      - 'robobarista/moveit_scene_bridge.py'
      - 'robobarista/vendor_runtime_preflight.py'
      - 'robobarista/current_90_tool_frames.py'
      - 'tests/test_current_90_tool_frames.py'
      - 'tests/test_real_latte_import.py'
      - 'tests/test_latte_dmp_integration.py'
      - 'tests/test_integration_quality_moveit.py'
      - 'tests/test_vendor_runtime_preflight.py'
      - '.github/workflows/selected-pr17-pr18-integration.yml'
  workflow_dispatch:

jobs:
  offline-source-and-geometry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric test dependencies (no actual robot)
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'pytest>=8' 'Pillow>=10'
      - name: Unit-test source, rigid pose, DMP, camera-QA and nominal collision export
        run: |
          python -m pytest -q tests/test_real_latte_import.py \
            tests/test_latte_dmp_integration.py \
            tests/test_integration_quality_moveit.py \
            tests/test_vendor_runtime_preflight.py
      - name: Compile imported offline modules
        run: |
          python -m compileall -q \
            robobarista/real_latte_dataset.py \
            robobarista/realman_fk_bridge.py \
            robobarista/external_pose_replay.py \
            robobarista/original_camera_tags.py \
            robobarista/latte_dmp.py \
            robobarista/vision_quality.py \
            robobarista/moveit_scene_bridge.py \
            robobarista/vendor_runtime_preflight.py
      - name: Export nominal MoveIt-only keepouts, no controller connection
        run: |
          python -m robobarista.moveit_scene_bridge --output /tmp/review_keepouts.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/review_keepouts.json').read_text())
          assert report['objects'] and not report['hardware_actuation_allowed']
          assert not report['robot_self_collision_validated']
          PY

  approved-90degree-tool-transform-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual MuJoCo/OSMesa scene dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6-dev libgl1 ffmpeg
          python -m pip install -r requirements.txt
      - name: Check approved 90deg dual IR40 tool and small tags stay intact
        run: |
          python -m pytest -q tests/test_dual_tool_90_preview.py tests/test_compact_apriltags.py
      - name: Validate MuJoCo FR5 wrist-to-pitcher/spout offset is not identity
        run: |
          python -m pytest -q tests/test_current_90_tool_frames.py

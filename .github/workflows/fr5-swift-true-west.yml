name: Focused Swift Mini True West View

on:
  pull_request:
    paths:
      - 'robobarista/swift_fr5_pick_stand.py'
      - 'tests/test_swift_fr5_pick_stand.py'
      - '.github/workflows/fr5-swift-true-west.yml'
  workflow_dispatch:

jobs:
  west-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MuJoCo headless render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6-dev libgl1 ffmpeg
          python -m pip install -r requirements.txt
      - name: Check camera-free six-axis robot and portafilter
        run: python -m pytest -q tests/test_swift_fr5_pick_stand.py
      - name: Run six-axis FR5 IK and 50cm-west 20cm-front visual render
        run: |
          python -m robobarista.swift_fr5_pick_stand \
            --output runs/swift_TRUE_WEST_50cm \
            --grasp-heading -30 --frames-per-segment 5 \
            --west-view --insertion-only \
            --render-width 900 --render-height 900
      - name: Validate real generated west camera and create preview contact sheet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('runs/swift_TRUE_WEST_50cm')
          d=json.loads((p/'summary.json').read_text())
          assert d['status']=='KINEMATIC_FR5_COMPLETE_PREVIEW_ONLY'
          assert d['tracking_cameras']==0
          assert d['robot_camera_feedback_used'] is False
          assert d['west_view_is_only_offline_visualization'] is True
          assert abs(d['west_view_eye_xyz_m'][0]-d['grinder_nominal_receiver_xyz_m'][0]+0.5)<1e-9
          assert abs(d['west_view_eye_xyz_m'][1]-d['grinder_nominal_receiver_xyz_m'][1]+0.2)<1e-9
          assert d['connected_portafilter_handle_visual_geometry'] is True
          assert d['video_frames']>25
          assert (p/d['mp4']).stat().st_size>100000
          fs=sorted((p/'frames').glob('fr5_*.png'))
          selected=[fs[0],fs[len(fs)//2],fs[-1]]
          imgs=[Image.open(f).convert('RGB').resize((520,562)) for f in selected]
          sheet=Image.new('RGB',(520*3,562),'#1c2730')
          for i,im in enumerate(imgs):sheet.paste(im,(i*520,0))
          sheet.save(p/'WEST_VIEWS_start_middle_end.png')
          print('VERIFIED: true 50cm-West, 20cm-front camera, no robot feedback')
          PY
      - name: Upload final video and proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINAL-REAL-MUJOCO-WEST-CAMERA-FR5
          path: |
            runs/swift_TRUE_WEST_50cm/*.mp4
            runs/swift_TRUE_WEST_50cm/*.png
            runs/swift_TRUE_WEST_50cm/summary.json

name: Artly-Inspired Workcell Preview
on:
  push:
    paths:
      - 'robobarista/barista_cell.py'
      - 'robobarista/cell_demo.py'
      - 'robobarista/workcell_constraints.py'
      - 'tests/test_barista_cell.py'
      - 'COLAB_WORKCELL.ipynb'
      - '.github/workflows/workcell.yml'
  workflow_dispatch:
jobs:
  scene-and-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install MuJoCo CPU dependencies and video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6-dev libgl1 libglx-mesa0 libgl1-mesa-dri ffmpeg
          python -m pip install -r requirements.txt
      - name: Render new robot-barista cell
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.cell_demo --frames 8 --fps 5 --width 920 --height 660 --output runs/workcell_ci --reach
      - name: Check content, video and real tag detections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/workcell_ci')
          s=json.loads((p/'summary.json').read_text())
          print('Workcell validation:',s)
          assert len(s['stations'])==7
          assert 'tamper' not in s['stations']
          assert s['tamper_integrated_in_grinder']
          assert not s['separate_tamper_station']
          assert len(s['cameras'])==3
          assert s['plastic_cup_instead_of_ceramic']
          assert s['tamper_actuator_exists']
          assert s['mp4_created']
          assert (p/'workcell_preview.png').stat().st_size>10000
          assert (p/'workcell_demo.mp4').stat().st_size>10000
          assert (p/'workcell_demo.gif').stat().st_size>10000
          assert len(s['reachability'])==7
          assert len(s['docking_targets'])==7
          assert s['no_contact_policy_test']['forbidden_pass_through_blocked']
          assert all(v['site_position_error_m']<1e-6 for v in s['docking_targets'].values())
          assert all(v['carried_tool_at_dock_clearance_ok']
                     for v in s['docking_targets'].values())
          assert all(v['exact_pose_spec_valid']
                     for v in s['docking_targets'].values())
          assert (p/'dock_targets.json').stat().st_size>100
          assert (p/'workspace_constraints.json').stat().st_size>100
          assert s['pitcher_tag_visible_frames']==8
          assert s['tamper_motor_diagnostics']['down_success']
          assert s['tamper_motor_diagnostics']['return_success']
          # Retire #62 with the separate tamper; all remaining fixed
          # references plus moving cup #70 and pitcher-top #71 in all frames.
          for tag in [61,63,64,65,66,67,68,69,70,71]:
              assert s['tag_visibility_by_frame'][str(tag)]==8, (tag,s['tag_visibility_by_frame'])
          PY
      - name: Save video and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robobarista-artly-inspired-workcell
          path: |
            runs/workcell_ci/workcell_preview.png
            runs/workcell_ci/workcell_last_frame.png
            runs/workcell_ci/workcell_demo.mp4
            runs/workcell_ci/workcell_demo.gif
            runs/workcell_ci/layout_topdown.png
            runs/workcell_ci/summary.json
            runs/workcell_ci/visibility.json
            runs/workcell_ci/reachability.json
            runs/workcell_ci/dock_targets.json
            runs/workcell_ci/workspace_constraints.json
          if-no-files-found: warn

name: RoboBarista Python tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install 'caliscope==0.11.8'
      - name: Execute all unit tests
        run: python -m pytest -q -ra --tb=short tests

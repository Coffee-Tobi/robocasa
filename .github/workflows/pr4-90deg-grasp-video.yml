name: PR4 90deg Held Tools and 20s Pour Regression
on:
  pull_request:
    paths:
      - 'robobarista/dual_90_tool_attachments.py'
      - 'robobarista/coffee_workflow.py'
      - 'robobarista/latte_art_20s.py'
      - 'tests/test_pr4_90deg_tool_attachments.py'
      - '.github/workflows/pr4-90deg-grasp-video.yml'
  workflow_dispatch:
jobs:
  verify-real-mujoco-90-gripped-props:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render/kinematic simulation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6-dev libgl1 ffmpeg
          python -m pip install -r requirements.txt
      - name: Verify gripper hierarchy, 90 degrees, handled cup and compact tags
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -m pytest -q tests/test_pr4_90deg_tool_attachments.py tests/test_dual_tool_90_preview.py
      - name: Run real 20-second coffee latte-art kinematic motion on 90 degree tools
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.latte_art_20s \
            --fps 5 --duration 20 --target-spout-mm 18 \
            --output runs/pr4_90deg_latte \
            --width 560 --height 420
      - name: Validate rendered 20s replay
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          o=Path("runs/pr4_90deg_latte")
          d=json.loads((o/"summary.json").read_text())
          assert d["status"]=="PASS"
          assert d["actual_90_degree_tool_adapter"]
          assert d["force_torque_sensor_before_both_grippers"]
          assert d["rigid_kinematic_handle_fixture"]
          assert not d["physical_grasp_force_verified"]
          assert not d["inactive_orthogonal_gripper_collision_validated"]
          assert d["duration_s"]==20.
          assert d["frames"]==100
          assert d["video_created"]
          assert d["spout_max_displacement_from_start_mm"]<=20.01
          movie=o/"latte_art_20s.mp4"
          duration=float(subprocess.check_output(["ffprobe","-v","error","-show_entries",
              "format=duration","-of","default=nw=1:nk=1",str(movie)]))
          assert abs(duration-20)<.1
          print("VALIDATED actual MuJoCo 90deg tool + carried pitcher 20s kinematic movie:",d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RoboBarista-PR4-90deg-IR40-20s-Kinematic-Latte
          if-no-files-found: warn
          path: |
            runs/pr4_90deg_latte/latte_art_20s.mp4
            runs/pr4_90deg_latte/summary.json
            runs/pr4_90deg_latte/spout_positions.json

name: Realistic Small AprilTag Camera Benchmark
on:
  pull_request:
    paths:
      - 'robobarista/compact_tags.py'
      - 'robobarista/camera_joint_replay.py'
      - 'tests/test_compact_apriltags.py'
      - 'tests/test_lerobot_native_latte.py'
      - 'robobarista/lerobot_native_latte.py'
      - 'robobarista/latte_dmp.py'
      - 'robobarista/vision_quality.py'
      - 'robobarista/moveit_scene_bridge.py'
      - 'tests/test_latte_dmp_integration.py'
      - 'tests/test_integration_quality_moveit.py'
      - '.github/workflows/compact-apriltags.yml'
  workflow_dispatch:
jobs:
  compact-three-camera-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vision, MuJoCo, OSMesa and tests
        run: |
          sudo apt-get install -y -qq libosmesa6 libgl1 ffmpeg
          python -m pip install -r requirements.txt
      - name: Test physically attached fiducials
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -m pytest -q tests/test_compact_apriltags.py tests/test_lerobot_native_latte.py tests/test_latte_dmp_integration.py tests/test_integration_quality_moveit.py
      - name: Run real rendered Pupil AprilTag cameras on small mounted markers
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.camera_joint_replay --capture-only --marker-profile compact --frames 13 --fps 5 --seed 14 --width 1280 --height 960 --output runs/compact_tags
      - name: Run historical large AprilTags on identical source and pixel resolution
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.camera_joint_replay --capture-only --marker-profile legacy --frames 13 --fps 5 --seed 14 --width 1280 --height 960 --output runs/large_tags
      - name: Check all camera frames and report errors without hiding any
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/compact_tags')
          summary=json.loads((p/'summary.json').read_text())
          print(json.dumps(summary,indent=2))
          baseline=json.loads(Path('runs/large_tags/summary.json').read_text())
          assert baseline['status']=='PASS',baseline
          large=json.loads(Path('runs/large_tags/camera_vs_truth_EVAL_ONLY.json').read_text())
          small=json.loads((p/'camera_vs_truth_EVAL_ONLY.json').read_text())
          from statistics import mean
          def aggr(rows):
              errors=[f['camera_vs_truth_mm'] for f in rows]
              return {'mean_mm':mean(errors),'max_mm':max(errors),
                      'p95_mm':sorted(errors)[int(.95*(len(errors)-1))]}
          comparison={'same_seed_and_trajectory':True,
                      'same_resolution_px':[1280,960],
                      'large':aggr(large),'compact':aggr(small),
                      'large_two_view_frames':baseline['camera_two_view_frames'],
                      'compact_two_view_frames':summary['camera_two_view_frames'],
                      'large_station_tags_detected':baseline['fixed_station_tags_recognized_in_initial_render'],
                      'compact_station_tags_detected':summary['fixed_station_tags_recognized_in_initial_render'],
                      'camera_placement_different_between_profiles':True,
                      'hardware_accuracy_confirmed':False}
          Path('runs/comparison.json').write_text(json.dumps(comparison,indent=2))
          print('COMPARISON',json.dumps(comparison,indent=2))
          assert summary['tag_profile']=='compact'
          assert summary['frames']==13
          assert summary['camera_valid_frames']==13,summary
          assert summary['camera_two_view_frames']==13,summary
          assert summary['max_camera_vs_truth_mm'] is not None
          assert summary['max_camera_vs_truth_mm']<5.,summary
          assert (p/'camera_capture.mp4').stat().st_size>10000
          PY
      - name: Export honest precision/readiness assessment (not a CI-failure shortcut)
        run: |
          python -m robobarista.vision_quality --capture runs/compact_tags --output runs/compact_tags/vision_quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('runs/compact_tags/vision_quality.json').read_text())
          assert q['capture_status']=='PASS'
          assert q['ready_for_real_hardware'] is False
          print('Virtual pitcher goal met:',q['virtual_position_target_met'])
          print('Station coverage goal met:',q['station_coverage_target_met'])
          PY
      - name: Check DFKI DMP integration with installed upstream package
        run: |
          python -m pip install 'movement_primitives>=0.9,<1'
          python -m robobarista.latte_dmp --camera runs/compact_tags/camera_measurements.json --output runs/compact_tags/offline_virtual_dmp.json --virtual-tip-offset-m -.069 0 .136 --fps 20
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runs/compact_tags/offline_virtual_dmp.json').read_text())
          assert d['status']=='OFFLINE_POSITIONAL_DMP_ONLY'
          assert not d['hardware_execution_allowed']
          assert len(d['virtual_spout_positions_m'])>13
          print('DFKI DMP generated',len(d['virtual_spout_positions_m']),'offline tip positions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RoboBarista-Realistic-Compact-AprilTags-RGBD-Benchmark
          path: |
            runs/compact_tags/summary.json
            runs/compact_tags/vision_quality.json
            runs/compact_tags/offline_virtual_dmp.json
            runs/comparison.json
            runs/large_tags/summary.json
            runs/compact_tags/camera_measurements.json
            runs/compact_tags/camera_vs_truth_EVAL_ONLY.json
            runs/compact_tags/fixed_reference_vision_check.json
            runs/compact_tags/camera_capture.mp4
            runs/compact_tags/video_frames/frame_0000.png
          if-no-files-found: warn

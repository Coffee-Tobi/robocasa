name: Handle-Mug and Compact Tags Scene Regression
on:
  pull_request:
    paths:
      - 'robobarista/coffee_workflow.py'
      - 'robobarista/full_barista_sensor_video.py'
      - 'robobarista/dual_ir40_concept.py'
      - 'tests/test_handle_mug_compact_video.py'
      - '.github/workflows/handle-mug-compact-video.yml'
  workflow_dispatch:

jobs:
  test-handle-grip-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MuJoCo, AprilTags, OSMesa and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6-dev libgl1 ffmpeg
          python -m pip install -r requirements.txt
      - name: Check mug handle geometry and physically small on-object tags
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -m pytest -q tests/test_handle_mug_compact_video.py tests/test_compact_apriltags.py
      - name: Render CURRENT small-tag + handle-mug workflow; no underside grip
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.coffee_workflow \
            --marker-profile compact --cup-style handle_mug \
            --camera-view handle_close --frames-leg 3 \
            --width 760 --height 570 --fps 7 \
            --output runs/handled_mug_compact
      - name: Check result claims separately from real grip/contact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('runs/handled_mug_compact')
          s=json.loads((d/'summary.json').read_text())
          assert s['status']=='PASS'
          assert s['tag_profile']=='compact'
          assert s['cup_style']=='handle_mug'
          assert s['unique_gripped_object_tags']
          assert s['front_quarter_handle_detail_with_overview_inset']
          assert not s['actual_cup_or_mug_pickup_executed']
          assert not s['offset_mug_payload_clearance_validated']
          assert (d/'coffee_workflow.mp4').stat().st_size>10000
          rec=json.loads((d/'recipe.json').read_text())
          names=[v['label'] for v in rec]
          assert any('Keramiktasse am Henkel' in x for x in names)
          assert any('Tasse am Henkel zum Giessplatz' in x for x in names)
          print('New coffee video: handle-mug + realistic attached AprilTags.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RoboBarista-Corrected-Handle-Mug-Compact-Tags-Video
          path: |
            runs/handled_mug_compact/coffee_workflow.mp4
            runs/handled_mug_compact/summary.json
            runs/handled_mug_compact/recipe.json

name: Precision Latte Spout Motor Control
on:
  push:
    paths:
      - 'robobarista/precision_pour.py'
      - 'tests/test_precision_pour.py'
      - '.github/workflows/precision-pour.yml'
      - 'robobarista/continuous_motion.py'
  workflow_dispatch:
jobs:
  precision-control:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install MuJoCo, Ruckig, FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6-dev libgl1 libglx-mesa0 libgl1-mesa-dri ffmpeg
          python -m pip install -r requirements.txt
      - name: Test small Cartesian task and three dynamic controllers on one Ruckig path
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.precision_pour --output runs/precision_ci --amplitude-mm 4 --angle-deg .75 --duration-s 3 --seed 14 --video-fps 8
      - name: Larger amplitude control experiment on same 3s duration
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -u -m robobarista.precision_pour --output runs/precision_large_ci --amplitude-mm 10 --angle-deg .75 --duration-s 3 --seed 14 --video-fps 8
      - name: Validate safety, independent spout measurement and produce comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/precision_ci')
          a=json.loads((p/'summary.json').read_text())
          print('PRECISION MODE:',json.dumps(a,indent=2))
          assert a['status']=='PASS'
          assert a['amplitude_x_mm']==4.0
          assert a['ruckig_segments']>=10
          assert not a['pitcher_physically_grasped']
          assert a['motor_simulator'].startswith('MuJoCo')
          assert set(a['methods'])=={'legacy_pd','velocity_pd','computed_torque'}
          assert all(v['status']=='PASS' for v in a['methods'].values())
          assert all(v['max_spout_error_mm']>=0 for v in a['methods'].values())
          assert all(v['first_safety_violation'] is None for v in a['methods'].values())
          larger=json.loads(Path('runs/precision_large_ci/summary.json').read_text())
          assert larger['status']=='PASS'
          assert larger['amplitude_x_mm']==10.0
          assert set(larger['methods'])==set(a['methods'])
          print('SMALL vs LARGE amplitudes, same duration')
          for name in a['methods']:
              print(name,'small spout max=',a['methods'][name]['max_spout_error_mm'],
                    'large spout max=',larger['methods'][name]['max_spout_error_mm'])
          assert (p/'precision_pour.mp4').stat().st_size>10000
          assert (p/'precision_controller_comparison.png').stat().st_size>10000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RoboBarista-Precision-Motor-Comparison
          path: |
            runs/precision_ci/precision_pour.mp4
            runs/precision_ci/precision_controller_comparison.png
            runs/precision_ci/precision_tracking.json
            runs/precision_ci/summary.json
            runs/precision_large_ci/summary.json
            runs/precision_large_ci/precision_controller_comparison.png
          if-no-files-found: warn
